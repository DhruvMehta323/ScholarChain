# ScholarChain RAG runtime configuration, schema version 1 (HOCON).
# Owner: domain-engineer. Defaults for the `rag.*` keys (see scholarchain.core.RuntimeConfigKeys).
# Precedence, highest first: environment variable SCHOLARCHAIN_RAG_<KEY> (key upper-cased, '.' and
# '-' replaced by '_'), then a -D / override value named scholarchain.rag.<key>, then this file.
# NO secrets here. model.anthropic-api-key-env-var is the NAME of the environment variable that
# holds the Anthropic credential; the credential itself is never configured, committed or logged.
# Bedrock uses the default AWS credential chain. The model IDs below are defaults to be confirmed
# against the account's model access before any live call (Phase 14-15).
rag {
  schema-version = 1
  model {
    # bedrock | anthropic | fake
    provider = "bedrock"
    bedrock-model-id = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    anthropic-model-id = "claude-sonnet-4-5"
    anthropic-endpoint = "https://api.anthropic.com/v1/messages"
    anthropic-api-key-env-var = "SCHOLARCHAIN_ANTHROPIC_API_KEY"
    # Retries after malformed output (0..2).
    max-malformed-retries = 2
  }
  budget {
    # Characters of retrieved context placed in one request.
    context-characters = 60000
    input-tokens = 30000
    output-tokens = 2048
  }
  timeout {
    model-millis = 30000
    request-millis = 120000
  }
  graph {
    # Bounds for every graph template call (depth 1..6, results 1..100).
    max-depth = 4
    max-results = 50
    timeout-millis = 10000
  }
  evidence {
    # Maximum items in one evidence bundle (1..500).
    max-items = 100
  }
}
