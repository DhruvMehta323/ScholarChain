# ScholarChain Hadoop module configuration, schema version 1 (HOCON).
# Owner: domain-engineer. Defaults for the `hadoop.*` keys (see scholarchain.core.HadoopConfigKeys).
# Precedence, highest first: environment variable SCHOLARCHAIN_HADOOP_<KEY> (key upper-cased,
# '.' and '-' replaced by '_'), then a -D / override value named scholarchain.hadoop.<key>, then
# this file. These keys are separate from the 21 keys of scholarchain-config.v1.conf.
hadoop {
  schema-version = 1
  # Unit: AUTHORS. A team with more authors than this is flagged as a large team (a flag only,
  # nothing is dropped).
  large-team-threshold = 50
  # Unit: PAIRS (n*(n-1)/2 for a team of n authors), NOT authors. Maximum number of coauthor
  # pairs emitted for one work. Default 499500 = C(1000,2), an n=1000 team. Evidence (max authors
  # per work in the DBLP selections): 1K run n=42 (861 pairs); 10K run n=88 (3,828 pairs); 100K
  # proxy n=182 (16,471 pairs). The cap therefore triggers on none of the 1K, 10K, 50K runs.
  pair-expansion-hard-cap = 499500
  reducers {
    normalize = 2
    teams = 2
    pairs = 2
    identifiers = 2
  }
  # none | gzip | snappy
  output-codec = gzip
}
