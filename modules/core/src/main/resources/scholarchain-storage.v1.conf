# ScholarChain storage module configuration, schema version 1 (HOCON).
# Owner: domain-engineer. Defaults for the `storage.*` module keys (see
# scholarchain.core.StorageConfigKeys). These are separate from the frozen storage.* keys of
# scholarchain-config.v1.conf (raw-bucket, curated-bucket, vector-bucket, ...), which are untouched.
# Precedence, highest first: environment variable SCHOLARCHAIN_STORAGE_<KEY> (key upper-cased,
# '.' and '-' replaced by '_'), then a -D / override value named scholarchain.storage.<key>, then
# this file. Every value is a scalar.
# NO real account IDs, ARNs, endpoints or secrets here: the values below are placeholders. The role
# ARN uses the dummy account 000000000000 and the bucket in source-s3-uri is a placeholder name;
# set both per environment through the environment variables.
storage {
  schema-version = 1
  # Object-key prefixes inside the data buckets (relative, end with '/', pairwise distinct).
  s3 {
    raw-prefix = "raw/"
    curated-prefix = "curated/"
    graph-prefix = "graph/"
    rag-prefix = "rag/"
    reports-prefix = "reports/"
    logs-prefix = "logs/"
  }
  neptune {
    bulk-load {
      role-arn = "arn:aws:iam::000000000000:role/scholarchain-neptune-load-placeholder"
      # opencypher or csv
      format = "opencypher"
      source-s3-uri = "s3://placeholder-scholarchain-bucket/graph/neptune-load/"
    }
  }
  dynamodb {
    run-ledger-table = "scholarchain-RunLedger"
    artifact-registry-table = "scholarchain-ArtifactRegistry"
    query-session-table = "scholarchain-QuerySession"
    entity-link-cache-table = "scholarchain-EntityLinkCache"
    evidence-bundle-table = "scholarchain-EvidenceBundle"
    # Analytics item tables (logical name = Spark load-manifest table); distinct from all others.
    analytics {
      researcher-metrics-table = "scholarchain-analytics-researcher-metrics"
      coauthor-edge-works-table = "scholarchain-analytics-coauthor-edge-works"
      bridges-table = "scholarchain-analytics-bridges"
      coreness-table = "scholarchain-analytics-coreness"
      temporal-changes-table = "scholarchain-analytics-temporal-changes"
      paths-table = "scholarchain-analytics-paths"
      path-estimates-table = "scholarchain-analytics-path-estimates"
      window-summary-table = "scholarchain-analytics-window-summary"
      identity-clusters-table = "scholarchain-analytics-identity-clusters"
      mention-researcher-table = "scholarchain-analytics-mention-researcher"
    }
  }
  vectors {
    bucket-name = "placeholder-scholarchain-vectors"
    index {
      researcher-profile = "researcher-profile-v1"
      collaboration-community = "collaboration-community-v1"
      paper-abstract = "paper-abstract-v1"
      collaboration-path = "collaboration-path-v1"
      topic-institution-summary = "topic-institution-summary-v1"
    }
  }
  # Bounds applied to every read-only graph query.
  query {
    max-depth = 6
    max-results = 100
    timeout-millis = 5000
  }
  # Retry with bounded exponential backoff (attempts <= 10, max delay <= 60000 ms).
  retry {
    max-attempts = 5
    base-delay-millis = 100
    max-delay-millis = 5000
  }
}
