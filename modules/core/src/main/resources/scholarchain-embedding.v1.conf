# ScholarChain embedding module configuration, schema version 1 (HOCON).
# Owner: domain-engineer. Defaults for the `embedding.*` module keys (see
# scholarchain.core.EmbeddingConfigKeys). Precedence, highest first: environment variable
# SCHOLARCHAIN_EMBEDDING_<KEY> (key upper-cased, '.' and '-' replaced by '_'), then a -D / override
# value named scholarchain.embedding.<key>, then this file. Every value is a scalar.
# NO secrets here. voyage.api-key-env-var is the NAME of the environment variable that holds the
# Voyage credential; the credential itself is never configured, committed or logged.
embedding {
  schema-version = 1
  # Default model: Bedrock Titan Text Embeddings V2.
  model {
    id = "amazon.titan-embed-text-v2:0"
    version = "v2"
    dimension = 1024
  }
  voyage {
    api-key-env-var = "SCHOLARCHAIN_VOYAGE_API_KEY"
  }
  queue {
    name = "scholarchain-embedding-jobs"
    dead-letter-name = "scholarchain-embedding-jobs-dlq"
    # Deliveries before a job is dead-lettered (1..10).
    max-attempts = 3
    # Documents per job (1..50).
    max-documents-per-job = 50
  }
  # DynamoDB table holding vector-key claims (conditional puts via the KeyValueStore port).
  claims {
    table-name = "scholarchain-embedding-key-claims"
  }
  # Dedicated index for live test suites; must never be one of the five production indexes.
  test {
    vector-index-name = "scholarchain-it-embedding-test"
  }
}
