# ScholarChain Spark module configuration, schema version 1 (HOCON).
# Owner: domain-engineer. Defaults for the `spark.*` keys (see scholarchain.core.SparkConfigKeys).
# Precedence, highest first: environment variable SCHOLARCHAIN_SPARK_<KEY> (key upper-cased,
# '.' and '-' replaced by '_'), then a -D / override value named scholarchain.spark.<key>, then
# this file. These keys are separate from the 21 keys of scholarchain-config.v1.conf.
# Every value must be a scalar (the loader rejects lists and objects), so the window list is one
# comma-separated string of inclusive year ranges.
spark {
  schema-version = 1
  # Comma-separated inclusive year windows "<start>-<end>", for example "2000-2009,2010-2019".
  # Must be non-empty; windows must be valid (start <= end, years 1000..9999) and must not overlap.
  windows = "2000-2004,2005-2009,2010-2014,2015-2019,2020-2024"
  # When true, one extra all-time window (1000-9999, GraphWindows.AllTime) is produced as well.
  include-all-time = true
  # Maximum BFS depth (hops) for bounded shortest paths. Must be > 0.
  bfs-max-depth = 6
  # Number of researcher pairs sampled for path evidence, and the seed of that sample.
  path-sample-pairs = 20
  path-sample-seed = 441
  # Average path length / effective diameter: number of BFS source researchers (k > 0) sampled
  # from the largest component, and the seed of that sample.
  avg-path-sources-k = 50
  avg-path-seed = 441
  # Iteration caps (each > 0).
  label-propagation-max-iterations = 20
  connected-components-max-iterations = 50
  k-core-max-iterations = 50
  # Maximum number of representative work IDs kept per aggregated edge (> 0).
  representative-work-ids-bound = 5
  # Partition counts (each > 0).
  shuffle-partitions = 8
  output-partitions = 4
  # Paths (non-blank). Relative paths resolve against the process working directory.
  checkpoint-dir = "modules/spark/target/checkpoints"
  output-root = "modules/spark/target/runs/default"
  input {
    root-i-dir = "modules/hadoop/target/runs/rootI/curated"
    hj6a-entity-views-dir = "modules/hadoop/target/runs/rootI/work/hj6a/entity-views"
    match-decisions-final-path = "modules/entity-resolution/target/p3/match-decisions-final.jsonl"
  }
  # Labels recorded in outputs (tokens: non-blank, no whitespace).
  policy-version = "coauthor-graph.v1"
  code-version = "dev"
}
