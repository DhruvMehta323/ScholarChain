# ScholarChain entity-resolution configuration, schema version 1 (HOCON).
# Owner: entity-resolution-engineer. Defaults for the `er.*` keys (see scholarchain.er.ErConfigKeys).
# Precedence, highest first: environment variable SCHOLARCHAIN_ER_<KEY> (key upper-cased, '.' and
# '-' replaced by '_'), then an override named scholarchain.er.<key>, then this file.
#
# PLACEHOLDER THRESHOLDS. Every value under researcher.threshold and work.threshold is a
# hand-chosen placeholder, NOT calibrated. Part B replaces them by tuning on the calibration split
# only (tool Calibrate writes the frozen policy). They must not be quoted as results.
er {
  schema-version = 1
  policy-version = "er-v1"
  feature-set-version = "er-features-v2"
  # ISO-8601 instant used as decision timestamp when a candidate carries no retrievedAt. Never the
  # wall clock, so identical inputs give identical bytes.
  decision-epoch = "2026-01-01T00:00:00Z"
  # Blocks with more members than this are routed to their fallback key; still larger: skipped.
  max-block-size = 500

  # Invariant per kind: 0 <= reject <= llm-band-low <= llm-band-high <= accept <= 1.
  # score >= accept: accepted; score < reject: rejected; otherwise unresolved; unresolved with
  # llm-band-low <= score <= llm-band-high is eligible for LLM adjudication.
  researcher.threshold {
    accept = 0.85
    reject = 0.45
    llm-band-low = 0.55
    llm-band-high = 0.80
  }
  work.threshold {
    accept = 0.85
    reject = 0.45
    llm-band-low = 0.55
    llm-band-high = 0.80
  }

  llm {
    # anthropic | bedrock (bedrock is not implemented in Phase 05 and fails with a clear message)
    provider = "anthropic"
    # PLACEHOLDER model id and prices: the human confirms both before the live run (P2).
    model = "claude-haiku-4-5"
    price-input-usd-per-mtok = 1.0
    price-output-usd-per-mtok = 5.0
    max-calls = 60
    max-attempts = 2
    max-output-tokens = 300
    max-cost-usd = 2.0
    timeout-seconds = 60
    # An LLM accept or reject below this confidence stays UNRESOLVED.
    min-confidence = 0.7
    # Gitignored by the repository rule for target/ directories.
    cache-path = "modules/entity-resolution/target/llm-cache/er-llm-cache.jsonl"
  }
}
