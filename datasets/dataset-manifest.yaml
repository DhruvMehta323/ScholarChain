        datasets/raw/crossref/works/errors.jsonl and no responses. These are NOT coverage and NOT
        404s. The orchestrator attributed them to a network outage. The reproduced cause was
        different: Python urllib raised SSLCertVerificationError ("unable to get local issuer
        certificate") because the python.org macOS interpreter has no CA store, while curl to the
        same host returned HTTP 200. The old error file is kept unmodified as raw evidence.
