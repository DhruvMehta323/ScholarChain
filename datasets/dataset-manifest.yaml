privacy:
  rules:
    - "Personal data (author names, ORCID iDs, affiliations) is stored only under the gitignored datasets/raw/ tree."
    - "Committed samples are minimised to counts, titles, years, DOIs and source identifiers. No author names and no ORCID iDs are committed."
    - "No ORCID-derived record-level sample is committed. This is a human decision: ORCID's Terms license use of Public Record Data including storage and distribution, but the committed-ORCID question was left conservative because the work order says not to commit when unsure."
    - "ORCID requests ask only for /works. No name, email, employment, education or address sections."
    - "The contact email and any API key come only from environment variables, are sent only in HTTP headers, are never printed, never stored and never committed. Stored request URLs pass through redact_url(). Verification: python3 datasets/scripts/check_no_secrets.py"
    - "ORCID and Crossref entries are used to link works, not to profile individuals. Downstream stages must keep identity matches uncertain and cite provenance."
    - "Respect removal: if a person asks for removal of ORCID or author data, delete from derived stores through a human-approved process (raw data deletion is human-only)."
  sources_read: ["https://info.orcid.org/terms-of-use/", "https://info.orcid.org/privacy-policy/", "https://help.openalex.org/llms.txt (lists an author-profile privacy page)"]

