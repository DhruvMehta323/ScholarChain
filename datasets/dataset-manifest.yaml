  method: "first three Crossref-retrieved DOIs in sha256(441|enrichment|key) order; compare title (normalised), year, author count against the DBLP selection"
  inspected: 3
  all_matches: {n: 99, title_equal: 99, year_equal: 90, author_count_equal: 99}

known_unresolved_questions:
  - "Retrieval date and method of the local dblp.xml are unrecorded; DBLP snapshot date is a lower bound from newest mdate."
  - "Crossref has no formal license identifier on its REST API page (reuse terms quoted instead)."
  - "ORCID anonymous API access works but contradicts the documented token requirement."
  - "Whether any ORCID-derived record-level sample may be committed (decision left to the human)."
  - "Whether one-work-per-year flooring is the desired stratification at larger sizes."
  - "MANUAL ACTION: approve certifi as an optional runtime dependency of fetch_common.py, or require the stdlib-only route (SSL_CERT_FILE pointing at a system CA bundle). Verification is never disabled either way."
  - "The scripts are uncommitted, so recorded code_version carries +uncommitted-scripts."
