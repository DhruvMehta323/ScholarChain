      fetched: "2026-11-19 via curl (README sentences re-confirmed by curl on repair 01)"
    snapshot:
      date: "2026-11-14"
      method: >-
        Newest mdate attribute observed over all 13,108,714 top-level records during the full lxml
        iterparse pass (see summary file). dblp.xml has no embedded generation date, so this
        is a lower bound of the file's generation date, not an official release date. File
        mtime (2026-11-15) is consistent but is not used. The official monthly release list
        was not matched against the file.
      observed_newest_mdate: "2026-11-14"
      evidence: "datasets/raw/dblp/derived/eligible_index.summary.json (gitignored) field newest_mdate"
    format: "XML, ISO-8859-1, DTD entities (dblp.dtd), several records per line"
    files:
      - {path: datasets/raw/dblp/dblp.xml, bytes: 5405851335, sha256: f9f1f1e19621f7b03edbe18f8e50e36af24d557a626177145965b974f1e22ef3, hash_command: "shasum -a 256 datasets/raw/dblp/dblp.xml"}
      - {path: datasets/raw/dblp/dblp.dtd, bytes: 13134, sha256: 2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6, hash_command: "shasum -a 256 datasets/raw/dblp/dblp.dtd"}
    size_estimate: "5,405,851,335 bytes uncompressed (observed). The server listing shows dblp.xml.gz at 1.0G on 2026-11-19."
    s3_prefixes:
      raw: "s3://${RAW_BUCKET}/dblp/snapshot_date=2026-11-14/"
      sample: "s3://${RAW_BUCKET}/samples/dblp/selection_size=1000/"
    parser_requirement: "lxml.etree.iterparse with load_dtd=True, resolve_entities=True, no_network=True, huge_tree=True; clear elements as you go."
    observed_counts:
      top_level_records: {article: 4518480, book: 21654, data: 31430, incollection: 71264, inproceedings: 4000250, mastersthesis: 27, phdthesis: 158395, proceedings: 65834, www: 4241380}
      article_plus_inproceedings: 8518730
      excluded_first_failing_reason: {dblpnote: 3, invalid_key: 0, empty_title: 0, non_numeric_year: 0, fewer_than_two_authors: 1025794, no_doi: 622385, duplicate_key: 0}
      eligible_records: 6870548
      eligible_years: 86
      observed_by: "python3 datasets/scripts/dblp_select.py index (157.4 s); summary in datasets/raw/dblp/derived/eligible_index.summary.json"
    subset_rule:
      eligibility: >-
        Tag is article or inproceedings; key is well formed and does not start with "dblpnote/";
        title non-empty after joining inline markup; year exactly four digits; at least two
        author elements; at least one ee element that is a doi.org URL (DOI normalised to
        canonical DOI rule, see canonical_doi_rule below); key occurs once among all
        article/inproceedings records. Conditions are evaluated in that order and the first
        failure is the recorded reason.
      algorithm: >-
        Seeded stratified selection. (1) Year allocation: every year with eligible records
        gets 1 work when N is at least the number of years, the remaining N minus years is
        allocated proportionally to the eligible count per year by the largest-remainder
        method, capped by availability. (2) Venue allocation inside a year: the year quota is
        allocated across venues proportionally to sqrt(eligible count) by largest remainder,
        capped by availability; remainder ties are broken by sha256(seed|"venue"|year|venue).
        Venue is the first two key segments (for example conf/acl). (3) Record choice inside
        a (year, venue) cell: the k records with the smallest sha256(seed|"key"|key). Output
        is independent of input order. Never the first N eligible records.
      seed: 441
      supported_sizes: [1000, 10000, 50000, 100000]
      size_note: "50000 added in repair 02 (instructor approval: the 50K scale replaces 100K). 100000 stays accepted by the script for the existing derived selection; no selection was run in repair 02."
      canonical_doi_rule: >-
        Implemented in datasets/scripts/doi_canonical.py (the only Python DOI normaliser; Scala
        implements the same rule). (1) Trim the WS set U+0009-000D, U+001C-001F, U+0020, U+0085,
        U+00A0, U+1680, U+2000-200A, U+2028, U+2029, U+202F, U+205F, U+3000 from both ends.
        (2) Remove at most one ASCII-case-insensitive prefix: https://doi.org/, http://doi.org/,
        https://dx.doi.org/, http://dx.doi.org/ (URL form), or doi: followed by U+0020 only (not URL
        form). (3) URL form only: strict percent-decode exactly once (a % not followed by two
        hex digits rejects; strict UTF-8; plus stays plus). Bare and doi: input are never decoded.
        (4) Lower-case ASCII A-Z only. (5) Reject if empty; the result must fully match 10. then 4
        to 9 ASCII digits, a slash, then one or more characters outside WS and the control set
        U+0000-001F, U+007F-009F. No Unicode normalisation, no query or fragment stripping.
        Every rejection yields no DOI. Outgoing Crossref and OpenAlex requests encode the
        canonical DOI exactly once (urllib.parse.quote(doi, safe="")), for example
        10.1000/a%2fb is requested as 10.1000%2Fa%252fb. DBLP eligibility additionally requires the
        ee value to be in URL form.
      canonical_doi_checks: "validate_manifest.py reads modules/core/src/test/resources/doi-normalization-vectors.tsv read-only (shared with the Scala suite; sha256 4b669451655aa283f27cad0b9f0b61c1072d4acfd1e4162e350075465e4a370d, 121 rows when recorded) and requires doi_canonical.normalize_doi to match every row, idempotence of accepted rows and at least 80 rows. A surrogate code point anywhere in the input is rejected first, as in Scala. python3 -I -B datasets/scripts/renormalize_check.py re-normalises every DOI in the committed samples offline: 2298 checked, 0 changed (repair 02)."
      script: datasets/scripts/dblp_select.py
      commands:
        adopt_legacy_cache: "SKIPPED by human decision. The legacy cache was built under eligibility policy 1; adopt now refuses it (exit 2, nothing written) because the current policy is 2."
        index: "python3 datasets/scripts/dblp_select.py index --xml-sha256 f9f1f1e19621f7b03edbe18f8e50e36af24d557a626177145965b974f1e22ef3"
        select_1000: "python3 datasets/scripts/dblp_select.py select --size 1000   # not run; blocked until the human-approved reindex (no eligible_index.meta.json; cache invalid under policy 2, select refuses to run)"
        select_10000: "python3 datasets/scripts/dblp_select.py select --size 10000   # not run; blocked until the human-approved reindex (no eligible_index.meta.json; cache invalid under policy 2, select refuses to run)"
        select_50000: "python3 datasets/scripts/dblp_select.py select --size 50000   # not run; blocked until the deferred reindex"
        select_100000: "python3 datasets/scripts/dblp_select.py select --size 100000   # not run; blocked until the human-approved reindex (no eligible_index.meta.json; cache invalid under policy 2, select refuses to run)"
      idempotency: "The index stage fully hashes the XML and DTD, then skips the pass only when the cache verifies (see cache_validation); otherwise it rebuilds. The select stage verifies the cache first and fails without writing outputs when it is invalid, then reads only the cache. A rerun of select_1000 reproduced sha256 52bbb09f... byte for byte (before cache metadata existed, script 1.0.0)."
      cache: {path: datasets/raw/dblp/derived/eligible_index.tsv.gz, sha256: 5c08b74a7b5e8ffa90a6c6c3b578d7ef30ac3571bf79488366a8cdb2d5b6ab46, gitignored: true, metadata_file: datasets/raw/dblp/derived/eligible_index.meta.json, metadata_status: "ABSENT and the cache is INVALID under eligibility policy 2 (built by script 1.0.0 under policy 1). Reindex is deferred pending human approval; until then select refuses to run and adopt refuses the legacy cache."}
      current_state: >-
        Repair 02 (human decisions): ELIGIBILITY_POLICY_VERSION is now "2" (canonical DOI rule),
        so the existing cache is invalid. adopt and the full 5.4 GB hash are skipped. Reindex and
        the 10K and 50K selections (and any 100K regeneration) are deferred until a human approves
        them. Three dblp.xml doi.org ee URLs are newly rejected (see newly_rejected_count_check). No
        selected DOI is affected directly, but the indirect effect of fewer eligible records on the
        per-year counts and per-venue weights is unquantified until the human-approved reindex, for
        the 1K, 10K and 100K selections alike.
      newly_rejected_count_check:
        command: "python3 -I -B datasets/scripts/renormalize_check.py --dblp-xml datasets/raw/dblp/dblp.xml"
        run: "repair 02 (V2-3 rerun), exit 0, about 75 s, offline"
        old_rule_basis: 'The recorded policy-1 rule from the pre-repair dblp_select.py (lines 87-91): DOI_URL_RE = re.compile(r"^https?://(?:dx\.)?doi\.org/(10\.[0-9]{4,9}/\S+)$", re.IGNORECASE); m = DOI_URL_RE.match(raw.strip()); None if no match, else unquote(m.group(1)).strip().lower(). The shape is checked on the raw, still-encoded text before unquote; unquote uses its default errors="replace". Canonical side: doi_canonical.normalize_doi_url_form.'
        observed:
          ee_elements: 10405443
          doi_org_ee_urls: 7932877
          accepted_by_old_rule: 7932867
          accepted_by_canonical_rule: 7932864
          newly_rejected_count: 3
          newly_rejected: ["https://doi.org/10.37789/icusi%202026.15 (old rule: 10.37789/icusi 2026.15)", "https://doi.org/10.1109/SWAT%20.1970 (old rule: 10.1109/swat .1970)", "https://doi.org/10.17706/jsw.16.4.%20182-199 (old rule: 10.17706/jsw.16.4. 182-199)"]
          newly_accepted_count: 0
          newly_accepted_examples: []
          different_value_count: 0
          different_value_examples: []
        direct_effect_on_selections: "0. Read-only exact match of the three old-rule DOIs in the doi column (column 5) of the selection TSVs: samples/dblp/dblp_selection_1000.tsv 0 (1000 rows), raw/dblp/derived/dblp_selection_10000.tsv 0 (10000 rows), raw/dblp/derived/dblp_selection_100000.tsv 0 (100000 rows). No selection DOI contains whitespace or %20 in any of the three files."
        read_only: "No hash of dblp.xml, no parse into the index, no writes anywhere; the XML is opened for reading as bytes."
        known_limits: "Matches line by line (an ee element split across lines is not seen); XML entities are not expanded, so counts are on raw ee text; report-only, always exit 0 whatever it finds; it is not a test and does not replace the reindex."
      cache_validation:
        script_version: "1.2.0 (repair 02: note N2, canonical DOI rule, policy 2, adopt policy check, size 50000)"
        metadata_file: "datasets/raw/dblp/derived/eligible_index.meta.json (written last, atomically)"
        fingerprint: "sha256 of canonical JSON {index_format_version, eligibility_policy_version, xml_sha256, dtd_sha256}. Seed and selection size are not part of it; they are recorded only in each selection provenance file."
        versions: {index_format_version: 1, eligibility_policy_version: "2", metadata_format_version: 1}
        policy_version_rule: "ELIGIBILITY_POLICY_VERSION must be bumped whenever the eligibility rules or the DOI normalisation used by the index change; the existing cache is then invalid and must be rebuilt."
        metadata_records: "xml path, sha256, bytes, mtime_ns; dtd path, sha256, bytes; fingerprint; sha256 and bytes of the cache and summary files; versions; script_version; code_version"
        reuse_requires: "metadata present and well formed; supported metadata, index-format and policy versions; fingerprint consistent with the metadata fields; cache and summary files present with recorded size and sha256; DTD sha256 equal; XML sha256 equal."
        invalid_cache_handling: "index: rebuild (cache, summary, metadata written to temporary names and renamed into place with os.replace, metadata last). select: exit 2 with the reasons, nothing written. Missing metadata, changed input, damaged cache file and unsupported version are all 'invalid'."
        xml_sha256_argument: "--xml-sha256 is an expected digest compared with the actual file (index, all, adopt hash the whole file) or with the metadata (select; the file is reached only through the default full hash). Mismatch is exit 2 with no rebuild and no write."
        select_xml_check: "select hashes the full XML by default (after cheaper checks pass); --fast-xml-identity substitutes a size and mtime_ns check, which cannot detect a same-size edit that preserved mtime. select runs with need_inputs=False: if the XML or DTD file is absent it proceeds on the verified cache alone and those checks are skipped."
        testable_interface: "datasets/scripts/dblp_select.py: --xml, --dtd, --cache-dir arguments; functions verify_cache, compute_fingerprint, build_index, adopt_legacy_cache, main(argv); module constants INDEX_FORMAT_VERSION, ELIGIBILITY_POLICY_VERSION."
        existing_xml_hash_evidence:
          recorded_sha256: f9f1f1e19621f7b03edbe18f8e50e36af24d557a626177145965b974f1e22ef3
          sources: ["manifest files[0]", "datasets/raw/dblp/sha256_dblp.xml.log (2026-11-19 13:45)", "derived/eligible_index.summary.json input_xml_sha256 (2026-11-19 13:51)", "Phase 03 agent reports: validate_manifest.py --full recomputed it and it matched (reports only; the reviewer could not verify them from files)"]
          file_identity_now: "bytes 5405851335 (equals recorded), mtime 2026-11-15 00:57:47, older than every hashing event above"
          conclusion: "Historical facts only. The recorded SHA-256 is consistent and circumstantial evidence, not proof: size and mtime cannot rule out a same-size edit that preserved mtime, and no hash result is bound to the file's identity in any file. Human decision (repair 02): skip adopt and skip hashing the full 5.4 GB dblp.xml now; no manual action is open for it. The index and select stages hash the file themselves at the deferred, human-approved reindex, which will verify or replace the recorded value."
        deferred_by_human_decision: ["multi-generation atomic publication with a metadata pointer", "interruption-recovery tests"]
      known_design_effect: "Because every year gets one work first, 86 of the 1,000 selected works come from the floor allocation, including sparse early years (1938 onward) and one year, 2027, that DBLP already contains (2 selected). Years with very few records are therefore over-represented relative to a proportional sample."
