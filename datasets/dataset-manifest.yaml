  dblp:
    role: mandatory seed
    source:
      name: "dblp computer science bibliography, XML export"
      download_page: "https://dblp.org/xml/"
      documentation: "https://dblp.org/xml/README.txt"
      doi_of_release_series: "10.4230/dblp.xml (https://dblp.org/xml/release/)"
      retrieval_date_of_local_file: "UNVERIFIED (file mtime is 2026-11-15; no download record exists)"
      retrieval_method_of_local_file: "UNVERIFIED (placed in datasets/raw/dblp/ before this phase)"
    license:
      identifier: "CC0-1.0 (the README also names ODC-By 1.0 as a secondary license; see secondary_license_quote)"
      status: verified
      url: "https://dblp.org/xml/README.txt"
      also_confirmed_at: "https://dblp.org/xml/release/ (License: Creative Commons Zero v1.0 Universal)"
      quote: "The metadata provided by dblp on its webpages, as well as their XML, JSON, RDF, RIS, BibTeX, and text export formats available at our website, is released under the CC0 1.0 Public Domain Dedication license."
