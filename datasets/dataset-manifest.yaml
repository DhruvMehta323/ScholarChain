# ScholarChain dataset manifest, Phase 03.
# Owner: dataset-engineer. Every downstream transformation cites this file as provenance.
# Values below are observed command outputs or quotes from official pages fetched with curl
# on 2026-11-19 (local date; retrieval timestamps in the raw envelopes are UTC and read
# 2026-11-20T03:3xZ because they were taken in the evening of 2026-11-19 local time).
# Anything that could not be verified is written UNVERIFIED.
manifest_version: 1
manifest_date: "2026-11-19"
validation:
  command: "python3 datasets/scripts/validate_manifest.py"
  declared_requirements:
    - "PyYAML (installed 6.0.3; used by validate_manifest.py only)"
    - "certifi (OPTIONAL, runtime-only; installed in this environment; imported by fetch_common.py tls_context() only when the interpreter has an empty CA store and SSL_CERT_FILE is unset; not needed by any other script)"
  secrets_check_command: "python3 datasets/scripts/check_no_secrets.py"
  note: "Scripts use python3 standard library plus lxml (dblp_select.py index stage only). Fetchers are stdlib-only if the interpreter has a CA store or SSL_CERT_FILE points at a system CA bundle; otherwise they fall back to certifi (optional, see declared_requirements). TLS certificate verification is never disabled. Note: the python.org installer's 'Install Certificates.command' is not a stdlib-only route because it pip-installs certifi."
  stdlib_only_tls_alternative: "export SSL_CERT_FILE=<path to a system CA bundle> before running the fetchers (supported at fetch_common.py tls_context())."

instructor_approval:
  statement: >-
    The OpenAlex, Crossref and ORCID datasets are bounded, DOI-driven subsets by design,
    following the specification's own bounded-retrieval requirement. This is a design choice,
    not an instructor-approved deviation. Selection criteria, retrieval procedure, matching
    rules, actual coverage, source information, and missing or inconsistent data are documented
    for each. Every enrichment dataset below is such a subset, linked to selected DBLP works.
    None is a full snapshot. The deviations the instructor actually approved (received
    2026-11-20) are recorded in docs/agent-runs/instructor-approvals.md and are listed under
    instructor_approved_deviations.
  instructor_approved_deviations:
    source: docs/agent-runs/instructor-approvals.md
    items:
      - "DBLP experiments at two scales, about 10K and about 50K real works; the 50K run replaces the 100K scale."
      - "S3 Vectors: up to 10K real vectors."
      - "Entity-resolution gold set of at least 170 pairs split 102 calibration and 68 held-out."
      - "Bedrock fallback: the Anthropic API (LLM) and Voyage AI (embeddings) when Bedrock quotas prevent timely execution."
    not_covered: "The bounded, DOI-driven enrichment subsets of OpenAlex, Crossref and ORCID."
  documentation_requirements_and_where_met:
    selection_criteria: "datasets.dblp.subset_rule and datasets.<enrichment>.subset_rule"
    retrieval_procedure: "datasets.<enrichment>.retrieval and datasets/scripts/fetch_*.py"
    matching_rules: "datasets.<enrichment>.linkage_keys and matching_rules"
    actual_coverage: "datasets.<enrichment>.coverage (observed counts)"
    source_information: "datasets.<enrichment>.source and .license (official URLs)"
    missing_or_inconsistent_data: "datasets.<enrichment>.limitations and datasets/samples/doi_spot_check.json"

s3_prefix_convention: >-
  Placeholders only. ${RAW_BUCKET} is supplied by configuration at runtime. No real bucket
  name is recorded. Nothing has been uploaded in this phase (S3 upload belongs to storage-engineer).

